name: collect

on:
  # 수동 실행. 스케줄과 별개로 언제든 재수집 가능
  #   - 같은 UTC 날에 다시 누르면 done_today 가 성공분을 건너뜀
  workflow_dispatch:
  # Actions cron 은 항상 UTC. 20:17 UTC = 익일 05:17 KST
  #   - 정각은 스케줄 요청이 몰리는 시간대. 17분으로 회피
  schedule:
    - cron: "17 20 * * *"

# permissions 명시 시 여기 없는 스코프는 전부 none
#   - 저장소 기본값 상속을 끊는 목적
#   - 쓰기는 push 하는 job 에만 (keepalive)
permissions:
  contents: read

# 이전 실행이 안 끝났으면 새 실행을 시작하지 않음
#   - 잠금 위치는 DB 가 아니라 실행기 층
#   - PostgREST 는 요청 1개 = 트랜잭션 1개 = 세션 1개. advisory lock 이 응답과 함께 풀림
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 요약이 이번 실행의 collect_run 행만 고르는 기준
      #   - start_run 의 started_at 과 같은 러너 시계
      - name: 수집 시작 시각 기록
        run: echo "COLLECT_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      # collect.py 는 표준 라이브러리만 사용. pip install 스텝 불필요
      - name: 최근 3개월 재수집
        id: collect
        # 신고 기한이 계약일로부터 30일. 최근 1~2개월은 항상 과소집계
        # 매일 같은 구간 재수신으로 신고 지연분 보충, 정정/해제 이력 축적
        env:
          # 시크릿은 env 로만 전달
          #   - run: 줄의 인자는 러너 프로세스 목록에 노출
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/collect.py --recent-months 3
      # 수집이 돌았으면 성공, 실패 모두 표를 남김
      #   - tee: Summary 탭과 실행 로그 양쪽에서 확인
      #   - shell: bash 는 pipefail 을 켬
      #   - 없으면 요약 명령이 실패해도 tee 때문에 성공으로 보임
      - name: 실행 요약
        if: always() && steps.collect.conclusion != 'skipped'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/collect.py --summary-since "$COLLECT_STARTED_AT" | tee -a "$GITHUB_STEP_SUMMARY"
      # failure() 만 쓰지 않는 이유
      #   - 앞선 어느 스텝이 실패해도 참
      #   - 요약 스텝 실패를 수집 실패로 알리게 됨
      # 알림 문구를 env 로 넘기는 이유
      #   - run 안에 두면 Semgrep 의 bash 해석이 이 한글 문구에서 깨짐
      #   - 일부만 해석된 파일은 ci.yml 의 --strict 에 걸려 CI 가 실패
      - name: 실패 구간 알림
        if: failure() && steps.collect.conclusion == 'failure'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALERT_TITLE: 수집 실패
          ALERT_MESSAGE: 실패한 구간과 에러 코드는 이 실행의 Summary 에 있다
        run: |
          python3 scripts/collect.py --failures-since "$COLLECT_STARTED_AT" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error title=$ALERT_TITLE::$ALERT_MESSAGE"

  # 수집이 쌓은 거래로 단지 마스터와 매매 파생값을 다시 계산
  # needs 만 쓰고 if 를 쓰지 않는 이유
  #   - 수집이 실패한 날은 이 job 도 건너뛰어야 함. 일부 구만 들어온 거래로 계산하지 않음
  #   - if: always() 를 붙이면 그 건너뛰기가 풀림
  # collect 에 스텝으로 붙이지 않은 이유
  #   - 이 job 은 공공데이터 키 없이 돎
  #   - 실패했을 때 수집을 다시 부르지 않고 이 job 만 재실행 가능
  refresh:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 대응표와 면적이 만든 CSV 는 이 job 안에서만 쓰고 커밋하지 않음
      #   - 그래서 DB 가 저장소의 data/*.csv 보다 최신
      #   - 로컬에서 적재할 때는 대응표와 면적을 먼저 다시 만들 것. 저장소 CSV 를 그대로 적재하면 DB 가 옛 값으로 돌아감
      - name: 대응표
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/crosswalk.py
      # 새 면적 동점이 생기면 여기서 실패하는 것이 의도
      #   - 승인 기준은 커밋된 data/complex-area.csv
      #   - 처리 절차는 docs/troubleshooting.md
      - name: 면적
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/area.py
      - name: 단지 마스터 적재
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/load_complex.py
      # shell: bash 는 pipefail 을 켬
      #   - 없으면 갱신이 실패해도 tee 때문에 성공으로 보임
      - name: 매매 파생값 갱신
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/refresh_stats.py | tee -a "$GITHUB_STEP_SUMMARY"

  # 60일 무커밋 시 스케줄 워크플로가 자동 비활성화되는 것 방어
  # collect 와 분리한 이유
  #   - 실행 보장만이면 if: always() 로 충분
  #   - 고유 이득은 신뢰 경계 분리. 외부 XML 을 파싱하는 수집 스텝에 쓰기 토큰을 쥐어주지 않음
  # needs 없음
  #   - 수집이 몇 주 연속 실패해도 60일 방어는 유지되어야 함
  #   - 수집 실패는 워크플로 run 전체를 실패로 표시하므로 장애가 가려지지 않음
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # persist-credentials 기본값 true 유지
      #   - 토큰이 .git/config 에 남아야 push 인증 가능
      - uses: actions/checkout@v7
      - name: 주 1회 last-run 갱신
        run: |
          set -euo pipefail

          STAMP=data/last-run.txt
          # 필요 최소치는 60일에 1커밋. 커밋 히스토리 오염을 피해 주 1회로 제한
          INTERVAL=$((7 * 24 * 3600))
          NOW=$(date -u +%s)

          # 판정 불가는 전부 '갱신해야 함' 으로 처리 (fail-open)
          #   - 파일 없음과 형식 깨짐을 같은 경로로 합침
          #   - 커밋 1개가 더 생기는 비용 << keepalive 를 놓쳐 워크플로가 죽는 비용
          PREV=""
          if [ -f "$STAMP" ]; then
            PREV=$(date -u -d "$(cat "$STAMP")" +%s 2>/dev/null || true)
          fi

          if [ -n "$PREV" ] && [ "$((NOW - PREV))" -lt "$INTERVAL" ]; then
            echo "마지막 갱신 이후 $((NOW - PREV))초 경과. 7일 미만이므로 커밋 생략"
            exit 0
          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" > "$STAMP"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$STAMP"
          git diff --staged --quiet || git commit -m "chore(data): update last-run timestamp"
          git push
